  --bg:#eef2f3; --surface:#fbfcfc; --sunk:#e1e8ea; --ink:#12272e; --muted:#51666d;
  --line:#c6d1d5; --brand:#0e5a63; --brand-ink:#ffffff; --mark:#ffd84a; --mark-ink:#2b2400;
  --ok:#1c7a4a; --ok-bg:#dcefe4; --miss:#a2461d; --miss-bg:#f6e3d8;
  --logo-front:#0e5a63; --logo-check:#ffffff; --logo-lines:#12272e;
  --display:"Bk Poppins","Poppins","Trebuchet MS",system-ui,sans-serif;
  --body:"Bk Inter","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1719; --surface:#152327; --sunk:#0a1214; --ink:#e6eeef; --muted:#97abb1;
  --line:#2b3f45; --brand:#58c2cc; --brand-ink:#04262a; --mark:#ffd84a; --mark-ink:#2b2400;
  --ok:#6fd39d; --ok-bg:#143326; --miss:#f0a47f; --miss-bg:#3a2015;
  --logo-front:#58c2cc; --logo-check:#04262a; --logo-lines:#12272e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1719; --surface:#152327; --sunk:#0a1214; --ink:#e6eeef; --muted:#97abb1;
  --line:#2b3f45; --brand:#58c2cc; --brand-ink:#04262a; --mark:#ffd84a; --mark-ink:#2b2400;
  --ok:#6fd39d; --ok-bg:#143326; --miss:#f0a47f; --miss-bg:#3a2015;
  --logo-front:#58c2cc; --logo-check:#04262a; --logo-lines:#12272e; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--body)}
.in{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2.1rem,7vw,3.4rem);letter-spacing:-.02em}
h2{font-size:clamp(1.55rem,4.6vw,2.2rem);letter-spacing:-.01em}
h3{font-size:1.3rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.92rem}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.eyebrow{font:500 .8rem var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}

/* header */
.top{padding-block:14px}
.top .in{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.logo svg{width:46px;height:46px;flex:none}
.logo b{display:block;font:700 1.45rem/1 var(--display);letter-spacing:-.01em}
.logo small{display:block;font:500 .78rem/1.3 var(--display);color:var(--muted);margin-top:3px}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 .95rem var(--body);padding:8px 16px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang .short{display:none}
@media (max-width:520px){.lang .long{display:none}.lang .short{display:inline}.lang button{padding:7px 12px}.logo svg{width:40px;height:40px}.logo b{font-size:1.3rem}.logo small{font-size:.72rem}}

/* hero */
.hero{padding-block:4px 56px}
.hero .in{display:grid;gap:22px;align-items:center}
.hero-text{display:flex;flex-direction:column;gap:16px;min-width:0}
.hero-text .lead{font-size:1.15rem;max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.chips li{font:600 .88rem var(--body);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.portrait{position:relative;width:min(58vw,230px);justify-self:center;margin:14px 18px 4px 8px}
.portrait::before{content:"";position:absolute;inset:0;background:var(--mark);border-radius:28px;transform:translate(-14px,14px) rotate(-6deg)}
.portrait img{position:relative;display:block;width:100%;height:auto;max-width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:28px;transform:rotate(2.5deg);box-shadow:0 18px 40px -22px rgba(9,30,36,.55)}
.portrait .tag{position:absolute;right:-12px;bottom:14px;transform:rotate(2.5deg);background:var(--brand);color:var(--brand-ink);font:700 .95rem var(--display);padding:8px 14px;border-radius:12px;white-space:nowrap}
@media (min-width:780px){
  .hero{padding-block:28px 80px}
  .hero .in{grid-template-columns:1.15fr .85fr;gap:48px}
  .portrait{order:2;width:min(100%,380px)}
}

/* buttons */
.btn{font:700 1.1rem var(--display);min-height:58px;border-radius:14px;cursor:pointer;padding:10px 22px;border:2px solid var(--ink);background:transparent;color:var(--ink);display:inline-grid;place-items:center;text-decoration:none}
.btn.main{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;padding-inline:8px;text-decoration:underline;text-underline-offset:4px;font-weight:500}
.btn:disabled{opacity:.6;cursor:default}

/* bands */
.band{padding-block:56px}
.band.alt{background:var(--surface);border-block:1.5px solid var(--line)}
.band .head{display:flex;flex-direction:column;gap:10px;margin-bottom:28px;max-width:40rem}
.about{display:grid;gap:20px}
.about .story{display:flex;flex-direction:column;gap:14px;max-width:62ch;font-size:1.08rem}
.about .story p:first-child{font:500 1.3rem/1.45 var(--display)}
@media (min-width:780px){.about{grid-template-columns:.8fr 1.2fr;gap:56px}.about .head{margin:0}}

.steps{list-style:none;margin:0;padding:0;display:grid;gap:14px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.steps li::before{content:counter(st);width:40px;height:40px;border-radius:12px;background:var(--mark);color:var(--mark-ink);display:grid;place-items:center;font:700 1.15rem var(--display)}
.steps h3{font-size:1.2rem}
@media (min-width:780px){.steps{grid-template-columns:repeat(3,1fr)}}

/* form */
.formwrap{max-width:680px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:20px;scroll-margin-top:16px}
@media (min-width:600px){.card{padding:28px}}
.prog{display:flex;flex-direction:column;gap:8px}
.prog p{font-weight:600;font-size:.95rem;color:var(--muted)}
.bar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bar i{height:8px;border-radius:4px;background:var(--line)}
.bar i.on{background:var(--brand)}
.step{display:flex;flex-direction:column;gap:16px}
.step h3:focus{outline:none}
.deal{background:var(--mark);color:var(--mark-ink);font-weight:600;padding:8px 12px;border-radius:10px;align-self:flex-start}
.services{display:flex;flex-direction:column;gap:10px}
.svc{font:inherit;color:inherit;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:14px;min-height:64px;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.svc .tick{width:30px;height:30px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:1.1rem;color:transparent;background:var(--surface)}
.svc .txt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.svc b{font:700 1.05rem var(--display)}
.svc small{color:var(--muted);font-size:.92rem;line-height:1.35}
.svc .pop{font:700 .72rem var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--mark);color:var(--mark-ink);border-radius:6px;padding:2px 7px;margin-bottom:2px}
.svc .price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.svc[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg)}
.svc[aria-pressed="true"] .tick{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.q{font-weight:600;font-size:1.02rem}
input[type=text],input[type=tel],textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:14px;width:100%}
input[aria-invalid="true"]{border-color:var(--miss);background:var(--miss-bg)}
textarea{min-height:90px;resize:vertical}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{font:700 1.02rem var(--display);min-height:58px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;padding:8px}
.yn button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg)}
.box{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sum{margin:0;display:flex;flex-direction:column;gap:10px}
.sum div{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding-bottom:10px}
.sum dt{font-size:.88rem;color:var(--muted);font-weight:600}
.sum dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sum .total dd{font:700 1.5rem var(--display);font-variant-numeric:tabular-nums}
.consent{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font-weight:600}
.consent.bad{border-color:var(--miss);background:var(--miss-bg)}
.consent input{width:28px;height:28px;flex:none;accent-color:var(--brand)}
.inlinks{display:flex;flex-wrap:wrap;gap:4px 16px}
.err{background:var(--miss-bg);color:var(--miss);font-weight:700;padding:12px 14px;border-radius:10px}
.nav{display:flex;gap:10px}
.nav .main{flex:1}
.done{text-align:center;align-items:center}
.bigtick{width:72px;height:72px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center;font-size:2.2rem;font-weight:700}
.ref{font:700 1.4rem var(--display);font-variant-numeric:tabular-nums}
.missing{text-align:left;align-self:stretch;background:var(--sunk);border-radius:12px;padding:12px 14px}
.missing ul{margin:6px 0 0;padding-left:22px}
.share{align-self:stretch;border-top:2px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}

/* faq */
.faq{display:flex;flex-direction:column;gap:10px;max-width:760px}
.faq details{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 18px}
.faq summary{cursor:pointer;font:700 1.08rem var(--display);padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--brand)}
.faq details[open] summary::after{content:"–"}
.faq details p{padding-bottom:16px;max-width:62ch}

/* legal + footer */
.legal{max-width:760px;padding-block:24px 56px}
.legal .card{gap:16px}
.legal h1{font-size:1.7rem}
.legal h2{font-size:1.15rem}
#legal-body{display:flex;flex-direction:column;gap:12px}
#legal-body p{white-space:pre-line;overflow-wrap:anywhere}
.linkbtn{font:600 .95rem var(--body);color:var(--brand);background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
footer{padding-block:32px 40px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;flex-direction:column;gap:10px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px}
</style>

</head>

function showErr(msg){ const e = $("err"); e.textContent = msg || ""; e.hidden = !msg; if (msg) e.scrollIntoView({block:"nearest"}); }

function renderStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  $("lang-de").setAttribute("aria-pressed", lang === "de");
  $("lang-sq").setAttribute("aria-pressed", lang === "sq");
  $("wa").href = "https://wa.me/?text=" + encodeURIComponent(t("shareText") + " " + SITE_URL);
}

function renderServices(){
  const box = $("services"); box.textContent = "";
  SERVICES.forEach(s => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "svc"; b.id = "svc-" + s.id;
    b.setAttribute("aria-pressed", selected.includes(s));
    const tick = document.createElement("span"); tick.className = "tick"; tick.textContent = "✓"; tick.setAttribute("aria-hidden", "true");
    const txt = document.createElement("span"); txt.className = "txt";
    if (s.popular){ const p = document.createElement("span"); p.className = "pop"; p.textContent = t("popular"); txt.append(p); }
    const n = document.createElement("b"); n.textContent = s[lang][0];
    const d = document.createElement("small"); d.textContent = s[lang][1];
    txt.append(n, d);
    const pr = document.createElement("span"); pr.className = "price"; pr.textContent = s.price ? s.price + " €" : "";
    b.append(tick, txt, pr);
    b.addEventListener("click", () => {
      selected = selected.includes(s) ? selected.filter(x => x !== s) : selected.concat(s);
      showErr(""); renderServices(); $("svc-" + s.id).focus();
    });
    box.append(b);
  });
}

function renderEscort(){
  $("escort-box").hidden = hasEscortSvc();
  $("escort-no").setAttribute("aria-pressed", !escort);
  $("escort-yes").setAttribute("aria-pressed", escort);
}

function renderSum(){
  const dl = $("sum"); dl.textContent = "";
  const row = (k, v, cls) => { const d = document.createElement("div"); if (cls) d.className = cls;
    const dt = document.createElement("dt"); dt.textContent = k; const dd = document.createElement("dd"); dd.textContent = v; d.append(dt, dd); dl.append(d); };
  row(t("sumNeed"), ordered().map(s => s[lang][0]).join(", "));
  if (!hasEscortSvc()) row(t("sumEscort"), escort ? t("yes") : t("no"));
  row(t("sumName"), $("f-name").value.trim());
  row(t("sumPhone"), $("f-phone").value.trim());
  row(t("sumAddr"), $("f-addr").value.trim());
  row(t("total"), priceText(), "total");
}

function legalDoc(kind){
  const o = k => OWNER[k] || "[noch eintragen]";
  const who = o("name") + "\nBashkë\n" + o("street") + "\n" + o("city");
  const contact = "Telefon: " + o("phone") + "\nE-Mail: " + o("email");
  if (kind === "impressum") return [
    ["h1","Impressum"], ["p","Angaben gemäß § 5 DDG"], ["p", who],
    ["h2","Kontakt"], ["p", contact],
    ["h2","Was ich mache und was nicht"], ["p","Ich helfe beim Ausfüllen von Anträgen, übersetze und begleite zu Terminen. Ich bin keine Behörde und keine Anwaltskanzlei. Ich biete keine Rechtsberatung und prüfe nicht, welcher Antrag im Einzelfall der richtige ist."],
    ["h2","Verbraucherstreitbeilegung"], ["p","Ich nehme nicht an Streitbeilegungsverfahren vor einer Verbraucherschlichtungsstelle teil."]];
  if (kind === "datenschutz") return [
    ["h1","Datenschutzerklärung"],
    ["h2","Wer ist verantwortlich?"], ["p", who + "\n" + contact],
    ["h2","Welche Daten ich verarbeite"], ["p","Name, Telefonnummer, Adresse, Ihr Anliegen und Ihre Nachricht. Über diese Website werden keine Dokumente hochgeladen."],
    ["h2","Wofür ich die Daten nutze"], ["p","Nur, um Ihre Anfrage zu bearbeiten: Anträge ausfüllen, übersetzen, Termine begleiten und Sie dazu kontaktieren. Ich nutze die Daten nicht für Werbung."],
    ["h2","Rechtsgrundlage"], ["p","Die Bearbeitung Ihrer Anfrage und meines Auftrags (Art. 6 Abs. 1 lit. b DSGVO) und Ihre Einwilligung beim Absenden (Art. 6 Abs. 1 lit. a und, soweit besondere Daten enthalten sind, Art. 9 Abs. 2 lit. a DSGVO). Sie können die Einwilligung jederzeit widerrufen."],
    ["h2","Wer die Daten bekommt"], ["p","Die Daten liegen bei meinem Hosting-Anbieter: " + o("host") + ". Er verarbeitet sie nur in meinem Auftrag. An Behörden gebe ich Unterlagen nur weiter, wenn Sie das möchten. Sonst gibt es keine Weitergabe."],
    ["h2","Wie lange ich speichere"], ["p","Ihre Angaben lösche ich spätestens " + OWNER.deleteDays + " Tage, nachdem Ihr Anliegen erledigt ist. Rechnungsdaten bewahre ich so lange auf, wie es das Gesetz verlangt."],
    ["h2","Ihre Rechte"], ["p","Sie können Auskunft, Berichtigung, Löschung und Einschränkung verlangen, der Verarbeitung widersprechen und Ihre Daten mitnehmen. Schreiben Sie mir dazu einfach. Sie können sich außerdem bei einer Datenschutz-Aufsichtsbehörde beschweren."],
    ["h2","Diese Website"], ["p","Die Seite setzt keine Cookies zu Werbe- oder Analysezwecken und lädt keine Inhalte von fremden Servern. In Ihrem Browser wird nur die gewählte Sprache gespeichert."]];
  return [
    ["h1","Widerrufsrecht"],
    ["p","Sie können Ihren Auftrag innerhalb von 14 Tagen ohne Angabe von Gründen widerrufen. Die Frist beginnt an dem Tag, an dem ich Ihren Auftrag bestätige."],
    ["h2","So widerrufen Sie"], ["p","Schreiben Sie mir eine klare Nachricht, zum Beispiel per E-Mail oder Brief, dass Sie den Auftrag widerrufen:\n" + who + "\n" + contact + "\nEs genügt, wenn Sie die Nachricht vor Ablauf der Frist absenden."],
    ["h2","Folgen des Widerrufs"], ["p","Ich zahle alles zurück, was Sie mir gezahlt haben, spätestens 14 Tage nach Ihrem Widerruf, auf demselben Weg, auf dem Sie gezahlt haben. Habe ich auf Ihren Wunsch schon vor Ablauf der Frist mit der Arbeit begonnen, zahlen Sie den Teil, den ich bis zum Widerruf schon geleistet habe."],
    ["h2","Wann das Widerrufsrecht endet"], ["p","Das Widerrufsrecht erlischt, wenn ich die Leistung vollständig erbracht habe und Sie vorher ausdrücklich zugestimmt haben, dass ich sofort beginne."],
    ["h2","Muster-Widerrufsformular"], ["p","An: " + o("name") + ", " + o("street") + ", " + o("city") + ", " + o("email") + "\nHiermit widerrufe ich den von mir abgeschlossenen Vertrag über folgende Dienstleistung: ________\nBestellt am: ________\nName: ________\nAnschrift: ________\nDatum, Unterschrift (nur bei Brief): ________"]];
}
function renderLegal(){
  const body = $("legal-body"); body.textContent = "";
  legalDoc(legal).forEach(([tag, text]) => { const el = document.createElement(tag); el.textContent = text; body.append(el); });
  $("draft").hidden = ["name","street","city","email","phone","host"].every(k => OWNER[k]);
  $("legal-lang").hidden = lang === "de";
}

function render(){
  renderStatic();
  $("site").hidden = !!legal; $("legal").hidden = !legal;
  if (legal){ renderLegal(); return; }
  ["1","2","3","done"].forEach(s => { $("step-" + s).hidden = String(step) !== s; });
  const done = step === "done";
  $("prog").hidden = done; $("nav").hidden = done;
  if (!done){
    $("prog-text").textContent = t("step") + " " + step + " " + t("of") + " 3";
    document.querySelectorAll(".bar i").forEach((el, i) => el.classList.toggle("on", i < step));
    $("back").hidden = step === 1;
    $("next").textContent = busy ? t("sending") : (step === 3 ? t("send") : t("next"));
    $("next").disabled = busy;
  }
  if (step === 1) renderServices();
  if (step === 2) renderEscort();
  if (step === 3) renderSum();
}

function go(n){
  step = n; showErr(""); render();
  $("form-card").scrollIntoView({behavior: smooth(), block: "start"});
  const h = document.querySelector("#step-" + n + " h3"); if (h) h.focus({preventScroll: true});
}

function valid(){
  if (step === 1 && !selected.length){ showErr(t("errSvc")); return false; }
  if (step === 2){
    const fs = [$("f-name"), $("f-phone"), $("f-addr")];
    fs.forEach(f => f.setAttribute("aria-invalid", !f.value.trim()));
    if (fs.some(f => !f.value.trim())){ showErr(t("errContact")); return false; }
  }
  if (step === 3){
    const ok = $("f-consent").checked, ok2 = $("f-start").checked;
    $("consent-box").classList.toggle("bad", !ok); $("start-box").classList.toggle("bad", !ok2);
    if (!ok || !ok2){ showErr(t("errStart")); return false; }
  }
  return true;
}

function finish(ref, preview){
  go("done");
  $("ref").textContent = ref;
  if (preview) document.querySelector("#step-done h3").textContent = t("pvTitle");
  const miss = curDocs().filter(k => k !== "sonst"), box = $("missing");
  box.textContent = ""; box.hidden = !miss.length;
  if (miss.length){
    const p = document.createElement("strong"); p.textContent = t("stillMissing");
    const ul = document.createElement("ul");
    miss.forEach(k => { const li = document.createElement("li"); li.textContent = DOCS[k][lang]; ul.append(li); });
    box.append(p, ul);
  }
}

async function submit(){
  const ref = "BK-" + Math.random().toString(36).slice(2, 6).toUpperCase();
  if (!UPLOAD_ENDPOINT){ finish(ref, true); return; }
  busy = true; render();
  try {
    const payload = {referenz: ref, anliegen: ordered().map(x => x.de[0]).join("; "), sprache: lang,
      name: $("f-name").value.trim(), telefon: $("f-phone").value.trim(), wohnort: $("f-addr").value.trim(), datum: "",
      nachricht: ($("f-msg").value.trim() + " | Sofortiger Beginn gewünscht: ja").replace(/^ \| /, ""), begleitung: escortBooked() ? "ja" : "nein", preis: "Preis: " + priceText(), dateien: []};
    const res = await fetch(UPLOAD_ENDPOINT, {method:"POST", body: JSON.stringify(payload)});
    if (!res.ok) throw new Error(res.status);
    const out = await res.json(); if (!out.ok) throw new Error(out.error);
    busy = false; finish(ref, false);
  } catch(x){ busy = false; render(); showErr(t("errSend")); }
}

$("next").addEventListener("click", () => { if (busy || !valid()) return; if (step === 3) submit(); else go(step + 1); });
$("back").addEventListener("click", () => { if (!busy && step > 1) go(step - 1); });
$("escort-no").addEventListener("click", () => { escort = false; renderEscort(); });
$("escort-yes").addEventListener("click", () => { escort = true; renderEscort(); });
$("f-consent").addEventListener("change", () => { $("consent-box").classList.remove("bad"); showErr(""); });
$("f-start").addEventListener("change", () => { $("start-box").classList.remove("bad"); showErr(""); });
document.querySelectorAll("[data-jump]").forEach(a => a.addEventListener("click", e => {
  e.preventDefault(); $(a.dataset.jump).scrollIntoView({behavior: smooth(), block: "start"});
}));
$("home").addEventListener("click", e => { e.preventDefault(); if (legal){ legal = ""; render(); } window.scrollTo({top: 0, behavior: smooth()}); });
document.querySelectorAll("[data-legal]").forEach(b => b.addEventListener("click", () => {
  if (!legal) scrollBefore = window.scrollY; legal = b.dataset.legal; showErr(""); render(); window.scrollTo(0, 0);
}));
$("legal-back").addEventListener("click", () => { legal = ""; render(); window.scrollTo(0, scrollBefore); });
$("copy").addEventListener("click", () => {
  const shown = () => { $("copy").textContent = t("copied"); };
  const fallback = () => { const u = $("copy-url"); u.textContent = SITE_URL; u.hidden = false; };
  try { navigator.clipboard.writeText(SITE_URL).then(shown, fallback); } catch(e){ fallback(); }
});
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang; try { localStorage.setItem("bashke-lang", lang); } catch(e){}
  render();
}));
render();
</script>
</body>
</html>
